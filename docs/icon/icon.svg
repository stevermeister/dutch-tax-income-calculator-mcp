<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0ea5a6" />
    </linearGradient>
    <!-- thetax.nl's own favicon checkmark: light cyan-blue at the base, deep navy at the tip -->
    <linearGradient id="check" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="55%" stop-color="#2f7cd6" />
      <stop offset="100%" stop-color="#2c3e7c" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Full euro sign, shifted up-left to leave room for the badge -->
  <g transform="translate(-28 -28) scale(0.86)" transform-origin="256 256">
    <path d="M 336 176
             A 118 118 0 1 0 336 340"
          fill="none" stroke="#ffffff" stroke-width="46"
          stroke-linecap="round" />
    <rect x="140" y="228" width="180" height="34" rx="17" fill="#ffffff" />
    <rect x="140" y="284" width="180" height="34" rx="17" fill="#ffffff" />
  </g>

  <!-- Checkmark badge, matching thetax.nl's existing favicon: short lower-left arm,
       long steep upper-right arm, gradient from light cyan-blue to navy -->
  <circle cx="378" cy="378" r="80" fill="#ffffff" />
  <path d="M 337 378 L 366 407 L 425 332"
        fill="none" stroke="url(#check)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
